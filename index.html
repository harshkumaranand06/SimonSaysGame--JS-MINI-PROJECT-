<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="minipjs.css">
</head>

<body>
    <h1>Simon Game</h1>
    <br>
    <h2>Highest Score = 0</h2>
    <br>
    <h3>Press any key to start the new game</h3>
    <br>
    <div class="boxContainer">
        <div class=" one">
            <div class="box red" type="button" id="red">1</div>
            <div class="box yellow" type="button" id="yellow">3</div>
        </div>
        <div class=" two">
            <div class="box green" type="button" id="green">2</div>
            <div class="box purple" type="button" id="purple">4</div>
        </div>


    </div>
    <script src="minipjs.js"></script>
</body>

</html>
